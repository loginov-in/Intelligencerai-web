<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Подтверждение аккаунта · IntelligencerAI</title>
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="{{ url_for('static', filename='img/Frame 1.png') }}">
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="{{ url_for('static', filename='css/ui.css') }}" rel="stylesheet">
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</head>
<body class="auth-body">
  <button class="btn btn-ghost btn-sm fixed top-4 right-4 z-10" data-theme-toggle type="button">
    <span data-theme-icon>◐</span>
    <span data-theme-label class="sr-only">Авто</span>
  </button>

  <div class="min-h-dvh flex flex-col items-center justify-center gap-6 p-4">
    <a class="brand-lockup text-base" href="{{ url_for('login') }}">
      <img class="brand-mark" src="{{ url_for('static', filename='img/Frame 1.png') }}" alt="">
      IntelligencerAI
    </a>

    <main class="w-full max-w-md panel p-6 sm:p-8 enter flex flex-col items-center gap-4 text-center" role="status" aria-live="polite">
      <div class="w-14 h-14 rounded-full bg-warning/15 text-warning flex items-center justify-center" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="9"/><path stroke-linecap="round" d="M12 7v5l3 2"/>
        </svg>
      </div>

      <h1 class="text-2xl font-bold tracking-tight">Ваш аккаунт ещё не подтверждён</h1>
      <p class="muted text-sm">
        Мы отправили аккаунт на модерацию. Дождитесь подтверждения, чтобы получить доступ к IntelligencerAI.
      </p>

      <button class="btn btn-primary w-full mt-2" type="button" id="refresh-btn">Проверить снова</button>

      <p class="muted text-xs">Нужна помощь? Напишите администратору вашей организации.</p>
      <a href="{{ url_for('logout') }}" class="link text-xs">Выйти из аккаунта</a>
    </main>

    <p class="muted text-xs">© <span data-year>2026</span> IntelligencerAI</p>
  </div>

  <script src="{{ url_for('static', filename='js/motion.js') }}"></script>
<script src="{{ url_for('static', filename='js/common.js') }}"></script>
  <script>
    var year = document.querySelector("[data-year]");
    if (year) year.textContent = new Date().getFullYear();

    document.getElementById("refresh-btn").addEventListener("click", function () {
      var btn = this;
      Intelli.setLoading(btn, true);
      fetch("{{ url_for('apps') }}", { redirect: "follow" })
        .then(function (res) {
          if (res.redirected || res.url.indexOf("/apps") !== -1) {
            window.location.href = res.url;
          } else {
            Intelli.toast("Аккаунт всё ещё на модерации", "info");
          }
        })
        .catch(function () { Intelli.toast("Не удалось проверить статус", "error"); })
        .finally(function () { Intelli.setLoading(btn, false); });
    });
  </script>
</body>
</html>
