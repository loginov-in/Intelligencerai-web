<!DOCTYPE html>
<html lang="ru" data-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
    <title>Intelligencerai: Подтверждение email</title>

    <link rel="icon" href="/static/img/Frame%201.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --font-family-primary: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            --font-size-xs: 14px;
            --font-size-sm: 16px;
            --font-size-md: 30px;
            --font-weight-base: 400;
            --line-height-base: 24px;

            --space-1: 1px;
            --space-2: 12px;
            --space-3: 16px;
            --space-4: 20px;
            --space-5: 24px;
            --space-6: 32px;

            --radius-xs: 16px;
            --radius-sm: 20px;
            --radius-md: 9999px;

            --motion-duration-instant: 120ms;
            --motion-duration-fast: 150ms;
            --motion-easing-standard: cubic-bezier(0.2, 0, 0, 1);
        }

        :root[data-theme="dark"],
        :root[data-theme="auto"][data-theme-preference="dark"] {
            color-scheme: dark;

            --color-text-primary: #afafaf;
            --color-text-secondary: #dcdcdc;
            --color-text-tertiary: #ededed;
            --color-text-inverse: #ffffff;
            --color-text-error: #ff9a9a;

            --color-surface-base: #000000;
            --color-surface-muted: #131313;
            --color-surface-raised: #1a1a1a;

            --color-border-subtle: rgba(255, 255, 255, 0.10);
            --color-border-strong: rgba(255, 255, 255, 0.24);
            --color-border-error: #ff9a9a;

            --color-overlay-hover: rgba(255, 255, 255, 0.06);
            --color-overlay-active: rgba(255, 255, 255, 0.12);
            --color-focus-ring: var(--color-text-tertiary);
            --color-primary-bg: var(--color-text-inverse);
            --color-primary-bg-hover: #ededed;
            --color-primary-bg-active: #dcdcdc;
            --color-primary-text: #000000;
        }

        :root[data-theme="light"] {
            color-scheme: light;

            --color-text-primary: #475569;
            --color-text-secondary: #1e293b;
            --color-text-tertiary: #0f172a;
            --color-text-inverse: #ffffff;
            --color-text-error: #dc2626;

            --color-surface-base: #f8fafc;
            --color-surface-muted: #ffffff;
            --color-surface-raised: #f1f5f9;

            --color-border-subtle: rgba(15, 23, 42, 0.06);
            --color-border-strong: rgba(15, 23, 42, 0.12);
            --color-border-error: rgba(220, 38, 38, 0.8);

            --color-overlay-hover: rgba(15, 23, 42, 0.04);
            --color-overlay-active: rgba(15, 23, 42, 0.08);
            --color-focus-ring: rgba(37, 99, 235, 0.6);

            --color-primary-bg: #2563eb;
            --color-primary-bg-hover: #1d4ed8;
            --color-primary-bg-active: #1e40af;
            --color-primary-text: #ffffff;
        }

        @media (prefers-color-scheme: light) {
            :root[data-theme="auto"] {
                color-scheme: light;

                --color-text-primary: #475569;
                --color-text-secondary: #1e293b;
                --color-text-tertiary: #0f172a;
                --color-text-inverse: #ffffff;
                --color-text-error: #dc2626;

                --color-surface-base: #f8fafc;
                --color-surface-muted: #ffffff;
                --color-surface-raised: #f1f5f9;

                --color-border-subtle: rgba(15, 23, 42, 0.06);
                --color-border-strong: rgba(15, 23, 42, 0.12);
                --color-border-error: rgba(220, 38, 38, 0.8);

                --color-overlay-hover: rgba(15, 23, 42, 0.04);
                --color-overlay-active: rgba(15, 23, 42, 0.08);
                --color-focus-ring: rgba(37, 99, 235, 0.6);

                --color-primary-bg: #2563eb;
                --color-primary-bg-hover: #1d4ed8;
                --color-primary-bg-active: #1e40af;
                --color-primary-text: #ffffff;
            }
        }

        @media (prefers-color-scheme: dark) {
            :root[data-theme="auto"] {
                color-scheme: dark;

                --color-text-primary: #afafaf;
                --color-text-secondary: #dcdcdc;
                --color-text-tertiary: #ededed;
                --color-text-inverse: #ffffff;
                --color-text-error: #ff9a9a;

                --color-surface-base: #000000;
                --color-surface-muted: #131313;
                --color-surface-raised: #1a1a1a;

                --color-border-subtle: rgba(255, 255, 255, 0.10);
                --color-border-strong: rgba(255, 255, 255, 0.24);
                --color-border-error: #ff9a9a;

                --color-overlay-hover: rgba(255, 255, 255, 0.06);
                --color-overlay-active: rgba(255, 255, 255, 0.12);
                --color-focus-ring: var(--color-text-tertiary);
                --color-primary-bg: var(--color-text-inverse);
                --color-primary-bg-hover: #ededed;
                --color-primary-bg-active: #dcdcdc;
                --color-primary-text: #000000;
            }
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            background-color: var(--color-surface-base);
            color: var(--color-text-secondary);
            font-family: var(--font-family-primary);
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-base);
            line-height: var(--line-height-base);
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            transition: background-color var(--motion-duration-fast) var(--motion-easing-standard),
                        color var(--motion-duration-fast) var(--motion-easing-standard);
        }

        .auth {
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: var(--space-4);
        }

        .auth__card {
            width: 100%;
            max-width: 400px;
            background-color: var(--color-surface-muted);
            border: var(--space-1) solid var(--color-border-subtle);
            border-radius: var(--radius-sm);
            padding: var(--space-6);
            display: grid;
            gap: var(--space-5);
            text-align: center;
            animation: card-in var(--motion-duration-fast) var(--motion-easing-standard) both;
        }

        @keyframes card-in {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
        }

        .auth__brand {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth__logo {
            display: block;
            height: 40px;
            width: auto;
        }

        .auth__icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            margin: 0 auto;
            border-radius: var(--radius-md);
            background-color: var(--color-surface-raised);
            border: var(--space-1) solid var(--color-border-subtle);
            color: var(--color-text-primary);
        }

        .auth__icon svg {
            width: 26px;
            height: 26px;
            display: block;
        }

        .auth__heading-group {
            display: grid;
            gap: var(--space-2);
            text-align: center;
        }

        .auth__title {
            margin: 0;
            font-size: var(--font-size-md);
            line-height: 1.2;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--color-text-tertiary);
        }

        .auth__subtitle {
            margin: 0;
            font-size: var(--font-size-xs);
            line-height: 20px;
            color: var(--color-text-primary);
        }

        .form {
            display: grid;
            gap: var(--space-3);
            text-align: left;
        }

        .field {
            display: grid;
            gap: 6px;
        }

        .field__label {
            font-size: var(--font-size-xs);
            font-weight: 500;
            line-height: 20px;
            color: var(--color-text-secondary);
        }

        .field__input {
            width: 100%;
            min-height: 44px;
            padding: 0 var(--space-3);
            background-color: var(--color-surface-base);
            color: var(--color-text-tertiary);
            border: var(--space-1) solid var(--color-border-strong);
            border-radius: var(--radius-xs);
            font-family: inherit;
            font-size: var(--font-size-sm);
            line-height: var(--line-height-base);
            transition: border-color var(--motion-duration-fast) var(--motion-easing-standard),
                        background-color var(--motion-duration-fast) var(--motion-easing-standard),
                        box-shadow var(--motion-duration-fast) var(--motion-easing-standard);
        }

        .field__input::placeholder {
            color: var(--color-text-primary);
        }

        .field__input:hover {
            border-color: var(--color-text-primary);
        }

        .field__input:focus-visible {
            outline: none;
            border-color: color-mix(in srgb, var(--color-focus-ring) 40%, var(--color-border-strong));
            box-shadow: 0 0 0 4px color-mix(in srgb, var(--color-focus-ring) 14%, transparent);
        }

        .field__input--code {
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.5em;
            text-indent: 0.5em;
        }

        .alert {
            margin: 0;
            padding: var(--space-2) var(--space-3);
            border: var(--space-1) solid var(--color-border-error);
            border-radius: var(--radius-xs);
            background-color: var(--color-surface-raised);
            color: var(--color-text-error);
            font-size: var(--font-size-xs);
            line-height: 20px;
            text-align: center;
        }

        .alert[hidden] {
            display: none;
        }

        .btn {
            --btn-height: 44px;
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
            width: 100%;
            min-height: var(--btn-height);
            padding: 0 var(--space-3);
            border: var(--space-1) solid transparent;
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: var(--font-size-sm);
            font-weight: 600;
            line-height: var(--line-height-base);
            cursor: pointer;
            text-decoration: none;
            background-color: var(--color-primary-bg);
            color: var(--color-primary-text);
            transition: background-color var(--motion-duration-fast) var(--motion-easing-standard),
                        opacity var(--motion-duration-fast) var(--motion-easing-standard);
        }

        .btn:hover {
            background-color: var(--color-primary-bg-hover);
            transition-duration: var(--motion-duration-instant);
        }

        .btn:active {
            background-color: var(--color-primary-bg-active);
        }

        .btn:focus-visible {
            outline: 2px solid var(--color-focus-ring);
            outline-offset: 2px;
        }

        .btn:disabled,
        .btn.is-loading {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .btn.is-loading .btn__label {
            visibility: hidden;
        }

        .btn.is-loading::after {
            content: "";
            position: absolute;
            width: 18px;
            height: 18px;
            border-radius: var(--radius-md);
            border: 2px solid currentColor;
            border-right-color: transparent;
            animation: spin 600ms linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .success[hidden],
        .form[hidden] {
            display: none;
        }

        .success {
            display: grid;
            gap: var(--space-4);
            justify-items: center;
        }

        .success .auth__icon {
            color: var(--color-text-tertiary);
        }

        @media (prefers-reduced-motion: reduce) {
            .auth__card {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <main class="auth">
        <section class="auth__card">
            <div class="auth__brand">
                <img
                    class="auth__logo"
                    src="/static/img/logo.svg"
                    alt="IntelligencerAI"
                    width="40"
                    height="40">
            </div>

            <span class="auth__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                    <path d="m3 7 9 6 9-6"></path>
                </svg>
            </span>

            <div class="auth__heading-group">
                <h1 class="auth__title">Подтверждение email</h1>
                <p class="auth__subtitle">Введите email, на который зарегистрирован аккаунт, — мы отправим вам код подтверждения.</p>
            </div>

            <form class="form" id="send-form" novalidate>
                <div class="field">
                    <label class="field__label" for="email">Email</label>
                    <input
                        class="field__input"
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required>
                </div>
                <button class="btn" type="submit" id="send-btn">
                    <span class="btn__label">Отправить код</span>
                </button>
            </form>

            <form class="form" id="verify-form" hidden>
                <div class="field">
                    <label class="field__label" for="code">Код из письма</label>
                    <input
                        class="field__input field__input--code"
                        type="text"
                        id="code"
                        name="code"
                        inputmode="numeric"
                        pattern="\d{6}"
                        maxlength="6"
                        autocomplete="one-time-code"
                        placeholder="000000"
                        required>
                </div>
                <button class="btn" type="submit" id="verify-btn">
                    <span class="btn__label">Подтвердить</span>
                </button>
                <p class="auth__subtitle">Код отправлен на <span id="sent-to"></span>. Действует 10 минут.</p>
            </form>

            <div class="success" id="success" hidden>
                <span class="auth__icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m5 13 4 4L19 7"></path>
                    </svg>
                </span>
                <div class="auth__heading-group">
                    <h1 class="auth__title">Email подтвержден</h1>
                    <p class="auth__subtitle">Адрес <span id="confirmed-email"></span> успешно подтвержден.</p>
                </div>
                <a class="btn" href="/apps"><span class="btn__label">Перейти к приложениям</span></a>
            </div>

            <p class="alert" id="alert" role="alert" hidden></p>
        </section>
    </main>

    <script>
        (function () {
            var sendForm = document.getElementById("send-form");
            var verifyForm = document.getElementById("verify-form");
            var successBox = document.getElementById("success");
            var alertBox = document.getElementById("alert");
            var sendBtn = document.getElementById("send-btn");
            var verifyBtn = document.getElementById("verify-btn");
            var emailInput = document.getElementById("email");
            var codeInput = document.getElementById("code");
            var sendLabel = sendBtn.querySelector(".btn__label");
            var defaultSendLabel = sendLabel.textContent;
            var currentEmail = "";
            var cooldownTimer = null;

            function showAlert(text) {
                alertBox.textContent = text || "";
                alertBox.hidden = !text;
            }

            function post(url, data) {
                return fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: new URLSearchParams(data)
                }).then(function (res) {
                    return res.json().catch(function () { return {}; }).then(function (body) {
                        if (!res.ok) {
                            var error = new Error(body.error || "Ошибка сервера");
                            error.status = res.status;
                            throw error;
                        }
                        return body;
                    });
                });
            }

            function startCooldown(seconds) {
                clearInterval(cooldownTimer);
                var left = seconds;
                sendBtn.disabled = true;
                cooldownTimer = setInterval(function () {
                    if (left <= 0) {
                        clearInterval(cooldownTimer);
                        sendBtn.disabled = false;
                        sendLabel.textContent = defaultSendLabel;
                        return;
                    }
                    sendLabel.textContent = "Повторно через " + left + " с";
                    left -= 1;
                }, 1000);
            }

            sendForm.addEventListener("submit", function (event) {
                event.preventDefault();
                showAlert("");
                sendBtn.classList.add("is-loading");

                post("/code/send_confirmation_email", { email: emailInput.value })
                    .then(function () {
                        currentEmail = emailInput.value.trim().toLowerCase();
                        document.getElementById("sent-to").textContent = currentEmail;
                        verifyForm.hidden = false;
                        startCooldown(60);
                        codeInput.focus();
                    })
                    .catch(function (error) {
                        showAlert(error.message);
                    })
                    .finally(function () {
                        sendBtn.classList.remove("is-loading");
                    });
            });

            verifyForm.addEventListener("submit", function (event) {
                event.preventDefault();
                showAlert("");
                verifyBtn.classList.add("is-loading");

                post("/code/verify_confirmation_email", { email: currentEmail, code: codeInput.value })
                    .then(function () {
                        sendForm.hidden = true;
                        verifyForm.hidden = true;
                        alertBox.hidden = true;
                        document.getElementById("confirmed-email").textContent = currentEmail;
                        successBox.hidden = false;
                    })
                    .catch(function (error) {
                        showAlert(error.message);
                        codeInput.select();
                    })
                    .finally(function () {
                        verifyBtn.classList.remove("is-loading");
                    });
            });
        })();
    </script>
</body>
</html>
