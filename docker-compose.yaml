services:
  web:
    build:
      context: .
      dockerfile: DockerFile
    image: intelligencerai-web:latest
    restart: unless-stopped
    env_file: .env
    expose:
      - "9120"
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf.d:/etc/nginx/conf.d:ro
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    networks:
      - internal

volumes:
  letsencrypt:
    name: intelligencerai-letsencrypt
  certbot-www:
    name: intelligencerai-certbot-www

networks:
  internal:
